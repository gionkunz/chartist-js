<!doctype html>
<html lang="en" data-redirect>
<head>
<meta charset="utf-8">
<title>Chartist moved to chartist.dev</title>
<link rel="canonical" href="https://chartist.dev/api/">
<script>(function () {
  var table = {};
  var has = function (key) { return Object.prototype.hasOwnProperty.call(table, key); };
  var hash = location.hash.slice(1);
  var key = has(hash) ? hash : hash.replace(/-code$/, '');
  var to = !hash ? "https://chartist.dev/api/" : has(key) ? table[key] : "https://chartist.dev/v0/api-documentation.html" + location.hash;
  var url = new URL(to, location.href);
  url.search = location.search;
  location.replace(url.href);
})();</script>
<meta http-equiv="refresh" content="0; url=https://chartist.dev/api/">
</head>
<body>
<p>The Chartist docs moved to <a href="https://chartist.dev/api/">https://chartist.dev/api/</a>.</p>
</body>
</html>
